<h1 mat-dialog-title>{{ data.title }}</h1>
<div mat-dialog-content>
  <form class="form" [formGroup]="formDelayCtrl">
    <p>{{ data.message }}</p>
    <mat-form-field appearance="outline" data-cy-form-input="delayTime">
      <mat-label i18n>Hours to delay</mat-label>
      <input
        matInput
        type="number"
        formControlName="hourControl"
        i18n-placeholder
      />
      <mat-error>{{ getDelayError('hourControl') }}</mat-error>
    </mat-form-field>
    <div mat-dialog-actions>
      <button mat-button (click)="onCancelClicked()">
        {{ data.cancel.toUpperCase() }}
      </button>

      <button
        mat-button
        (click)="onOkClicked()"
        [mat-dialog-close]="data"
        [color]="data.confirmColor"
        [disabled]="!formDelayCtrl.valid"
        data-cy-form-button="formDelayCtrlSubmit"
      >
        {{ data.accept.toUpperCase() }}
      </button>
    </div>
  </form>
</div>
