<h1 mat-dialog-title>{{ data.title }}</h1>
<div mat-dialog-content>
  <form
  novalidate
  class="form"
  [formGroup]="formDelayCtrl"
  >
    <p>{{ data.message }}</p>
    <mat-form-field appearance="outline">
      <mat-label i18n>Hours to delay</mat-label>
      <input 
        matInput
        type="number"
        [min]="MIN_DELAY"
        [max]="MAX_DELAY"
        formControlName="hourControl"
        i18n-placeholder
      />
    </mat-form-field>
    </form>
</div>

<div mat-dialog-actions>
  <button
    mat-button
    (click)="onCancelClicked()">
    {{ data.cancel.toUpperCase() }}
  </button>

  <button
    mat-button  
    (click)="onOkClicked()"
    [mat-dialog-close]="data"
    [color]="data.confirmColor">
    {{ data.accept.toUpperCase() }}
  </button>
</div>
